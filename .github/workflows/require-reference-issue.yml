name: Require Issue Reference

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  require-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Check PR body for issue reference
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$PR_BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]*#[0-9]+'; then
            echo "Issue reference found."
          else
            echo "::error::Pull request must reference an issue using 'Closes #123', 'Fixes #123', or 'Resolves #123'."
            exit 1
          fi
